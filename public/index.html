<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salud María</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <p class="eyebrow">Registro personal de salud</p>
      <h1>Salud <span>María</span></h1>
      <p id="patient-info" class="muted"></p>
    </header>

    <div class="tabs" role="tablist" aria-label="Secciones de salud">
      <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="glucose">Glucosa</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="medications">Medicamentos</button>
    </div>

    <section role="tabpanel" data-panel="glucose" aria-labelledby="glucose-title">
      <div class="date-bar" aria-label="Fecha del registro">
        <label for="record-date">Fecha</label>
        <input id="record-date" type="date">
        <button id="load-date" class="secondary">Ver día</button>
      </div>
      <div class="section-heading glucose-heading">
        <div><p class="eyebrow">Antes de cada comida</p><h2 id="glucose-title">Glucosa</h2></div>
        <span>mg/dL</span>
      </div>
      <div id="glucose-cards" class="glucose-grid"></div>

      <section aria-labelledby="history-title">
      <div class="section-heading history-heading"><div><h2 id="history-title">Historial de glucosa</h2></div><span>Registros guardados</span></div>
      <div id="history" class="history-list"></div>
      </section>
    </section>

    <section role="tabpanel" data-panel="medications" hidden aria-labelledby="medications-title">
      <div class="section-heading"><div><p class="eyebrow">Referencia de tratamiento</p><h2 id="medications-title">Medicamentos</h2></div></div>
      <p class="muted">Esta pestaña muestra la rutina indicada. No registra tomas ni horarios.</p>
      <div id="medication-groups"></div>
    </section>
  </main>
  <template id="glucose-template">
    <article class="card glucose-card"><h3></h3><label>Valor <input class="glucose-value" type="number" inputmode="numeric" min="20" max="700" placeholder="Ej. 110"></label><label>Hora <input class="glucose-time" type="time"></label><button class="save-glucose">Guardar</button><p class="status" aria-live="polite"></p></article>
  </template>
  <script src="app.js"></script>
</body>
</html>
